# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=expense-management-backend

# Datasource Configuration
# Defaults to file-based persistent database with MySQL compatibility mode for zero-setup local dev.
# When MySQL is running, override via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/expensedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 Console (available at http://localhost:8080/h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom Security / JWT Configuration (Min 256 bits secret)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# File Storage Configuration
app.upload.dir=${UPLOAD_DIR:uploads/receipts}

# Logging
logging.level.com.expensemanagement=INFO
logging.level.org.springframework.security=WARN
